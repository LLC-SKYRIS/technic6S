<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Документация</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
* { box-sizing: border-box; }
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:#f5f6f8;
  color:#333;
}

/* ===== ШАПКА ===== */
.gen-header{
  position: sticky;
  top: 0;
  z-index: 50;
  display:flex;
  align-items:center;
  gap:16px;
  padding: 14px 18px;
  background:#ffffff;
  border-bottom:1px solid #e1e3e9;
  font-weight: 400;
  letter-spacing: normal;
  color: #666;
}

.icon-home{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:inherit;
  min-width: 80px;
}

/* Оставляем только SVG-лого */
.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.logo img{
  height:14px;
  width:auto;
  display:block;
}

.header-nav-link{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.header-nav-link a{
  text-decoration:none;
  color:#444;
  font-weight:400; 
  border-bottom: 1px solid transparent;
}
.header-nav-link a:hover{
  border-bottom-color:#999;
}

.menu-toggle{
  margin-left:auto;
  display:none;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
  text-decoration:none;
  color:#444;
  font-weight:400;
}
.material-icons{
  font-family: inherit;
  font-weight: 400;
  letter-spacing: normal;
}

.wy-header-nav-search{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}
.wy-header-nav-search .input{
  display:flex;
  align-items:center;
}
.wy-form input[type="text"]{
  width:min(340px, 46vw);
  padding:10px 12px;
  border-radius: 12px;
  border:1px solid #e1e3e9;
  background:#f7f8fb;
  outline:none;
}
.wy-form input[type="text"]:focus{
  background:#fff;
  border-color:#c8ccda;
}

/* ===== Контент ===== */
.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.wy-nav-content{
  max-width: 1200px;   /* как у шаблона */
  margin: 0 auto;      /* центрирование */
  width: 100%;
}
.rst-content{
  padding-left: clamp(16px, 4vw, 56px);
  padding-right: clamp(16px, 4vw, 56px);
  padding-top: 32px;
  padding-bottom: 32px;
}

/* ===== Карточки ===== */
.cards-row{
  display:flex;
  gap:32px;
  flex-wrap:wrap;
}
.big-card{
  flex:1 1 420px;
  min-height:320px;
  background:#f1f2f5;
  border-radius:26px;
  text-decoration:none;
  color:inherit;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
  border:1px solid #e1e3e9;
  transition: transform .18s ease, box-shadow .18s ease;
}
.big-card:hover{
  transform: translateY(-4px);
  box-shadow:0 14px 28px rgba(0,0,0,0.12);
}

 
.big-card-inner{
  padding: 40px 52px;
  height: 100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:32px;
}

/* Левая часть (текст) */
.big-card-text{
  flex: 1;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.big-card-text .title{
  font-size:24px;
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.big-card-text span{ text-transform:uppercase; }
.big-card-text .accent{ font-weight:700; }

/* Hover-блок "в раздел" */
.go-link{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:14px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:#444;
  opacity:0;
  transform: translateY(6px);
  transition: opacity .2s ease, transform .2s ease;
}
.go-link .divider{
  width:120px;
  height:1px;
  background:#bbb;
}
.big-card:hover .go-link{
  opacity:1;
  transform: translateY(0);
}

/* Правая часть (картинка) */
.big-card-image{
  flex: 0 0 58%;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}
.big-card-image img{
  max-width:100%;
  max-height:360px;    /* подбери: 220–300 */
  object-fit:contain;
  display:block;
}

/* ===== Футер  ===== */
footer{
  margin-top:auto;
  background:#fff;
  border-top:1px solid #e1e3e9;
  padding: 22px 18px;
}
.projectInfo{
  display:flex;
  flex-direction:column;
  gap:10px;
  color:#666;
}
.projectInfo a{
  color:#444;
  text-decoration:none;
  border-bottom:1px solid transparent;
  width: fit-content;
}
.projectInfo a:hover{
  border-bottom-color:#999;
}
.contentInfo{
  margin-top:14px;
  color:#888;
  font-size:13px;
  margin-top:0;
  text-align:right;
}

/* Обёртка только для позиционирования */
.search-inline{
  position: relative;
  width: min(360px, 46vw);
}

/* Сам input */
.search-inline input[type="text"]{
  width: 100%;
  padding: 10px 140px 10px 40px; /* место под лупу слева */
  border-radius: 999px;
  border: 1px solid #e1e3e9;
  background: #ffffff;
  outline: none;
  font-size: 15px;
  color: #333;
}

/* Лупа внутри */
.search-inline .search-icon{
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  opacity: .45;
  pointer-events: none; /* чтобы не мешала клику */
}

/* Hover / focus */
.search-inline input[type="text"]:hover{
  border-color:#d3d7e3;
}
.search-inline input[type="text"]:focus{
  border-color:#c8ccda;
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
}

/* ===== Адаптив ===== */
@media (max-width: 768px){
  .rst-content{ padding: 20px 16px 24px; }

  .big-card-inner{
    padding:28px 24px;
    flex-direction: column-reverse;
    text-align:center;
  }
  .big-card-image{
    justify-content:center;
    width:100%;
  }

  .wy-header-nav-search{ width:100%; margin-left:0; }
  .gen-header{ flex-wrap:wrap; }
  .header-nav-link{ width:100%; }
  .wy-form input[type="text"]{ width: 100%; }
}
</style>

  <!-- HonKit styles for search -->
<link rel="stylesheet" href="gitbook/style.css">
<link rel="stylesheet" href="gitbook/gitbook-plugin-search/search.css">

</head>

<body>
<div class="page">

  <nav class="gen-header">
    <a href="#" class="icon-home">
      <div class="logo">
        <img src="images/logo.svg" alt="SKYRIS" />
      </div>
    </a>

    <div class="nav-link header-nav-link">
      <a href="https://skyris.pro/" target="_blank" rel="noopener"><span>Сайт SKYRIS</span></a>
      <a href="https://t.me/skyris_public" target="_blank" rel="noopener"><span>Новости компании</span></a>
    </div>

    <a class="menu-toggle" data-toggle="wy-nav-top"><span class="material-icons">menu</span></a>

    <div class="wy-header-nav-search">
      <div class="input" role="search">
       <form id="site-search-form" class="wy-form search-inline" action="#" method="get" role="search">
          <span class="search-icon" aria-hidden="true">🔍</span>
        
          <input
            id="site-search-input"
            type="text"
            name="q"
            placeholder="Search something..."
            autocomplete="off"
            onfocus="this.placeholder=''"
            onblur="this.placeholder='Search something...'"
          >
        </form>



      </div>
    </div>
  </nav>

  <div class="wy-nav-content">
    <!-- Хлебные крошки (скрыты) -->
    <div role="navigation" aria-label="Page navigation" style="visibility: hidden;">
      <ul class="wy-breadcrumbs">
        <li>
          <a href="#" aria-label="Home">
            <span>Главная</span>
          </a>
        </li>
        <li class="bread-diveder"> ➤ </li>
      </ul>
    </div>

    <script type="text/javascript">
      const bcWrapper = document.querySelector("div[aria-label='Page navigation']");
      if (bcWrapper) bcWrapper.style.visibility = "hidden";
    </script>

    <div class="rst-content">
      <main>
        <div class="cards-row">

          <!-- Техник 6S -->
          <a class="big-card" href="technic6S/">
            <div class="big-card-inner">

              <div class="big-card-text">
                <div class="title">
                  <span>Техник </span><span class="accent">6S</span>
                </div>
                <div class="go-link">

                </div>
              </div>

              <div class="big-card-image">

              </div>

            </div>

          <!-- Пилот FPV -->
          <a class="big-card" href="pilotFPV/">

                  <span>Пилот </span><span class="accent">FPV</span>

                  <span class="text">В раздел</span>

              </div>

  </div>

  <footer>
    <div class="projectInfo">
      <span>Обратиться за помощью в техническую поддержку</span>
      <a href="https://t.me/SKYRIS_support" target="_blank" rel="noopener">• telegram @SKYRIS_support</a>
      <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
    </div>

    <div role="contentinfo" class="contentInfo">
      ООО «Скайрис» 2025 © Все права защищены
    </div>
  </footer>

</div>
  
<script>
  /**
   * Страницы HonKit, на которых гарантированно работает поиск.
   * Укажите реальные существующие страницы в каждой книге.
   */
  const BOOKS = [
    { base: "technic6S", page: "OrangePi.html" },
    { base: "pilotFPV",  page: "index.html" } // ← замените, если у вас другое имя
  ];

  function searchEverywhere(q) {
    q = (q || "").trim();
    if (!q) return;

    BOOKS.forEach((book, i) => {
      const base = book.base.replace(/\/+$/, "");
      const url = `${base}/${book.page}?q=${encodeURIComponent(q)}`;

      // первую книгу открываем в этой вкладке, вторую — в новой
      if (i === 0) {
        window.location.href = url;
      } else {
        window.open(url, "_blank", "noopener");
      }
    });
  }

  const form = document.getElementById("site-search-form");
  const input = document.getElementById("site-search-input");

  if (form && input) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      searchEverywhere(input.value);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        searchEverywhere(input.value);
      }
    });
  }
</script>




</body>
</html>
