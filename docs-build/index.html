<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Документация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#f5f6f8;
      color:#333;
    }

    /* WEB CONTAINER */
    .container{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px; /* боковые поля, чтобы не липло к краю */
    }

    /* “Оболочка” как на сайтах: белый блок + тень + большие отступы */
    .shell{
      margin: 28px 0;
      background:#fff;
      border: 1px solid #e7e9ef;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .page{
      min-height: 100vh;
      padding: 44px 56px 36px; /* стало “воздуха” больше */
      display:flex;
      flex-direction:column;
    }

    /* ЛОГОТИП */
    .header{ margin-bottom: 34px; }
    .logo img{
      height: 36px;
      width:auto;
      display:block;
    }

    /* КАРТОЧКИ */
    .cards-row{
      display:flex;
      gap: 40px;          /* больше расстояние между карточками */
      flex-wrap:wrap;
      margin-top: 8px;
    }

    .big-card{
      flex: 1 1 460px;     /* чуть шире */
      min-height: 340px;   /* чуть выше */
      background:#f1f2f5;
      border-radius: 28px;
      text-decoration:none;
      color:inherit;
      overflow:hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      border: 1px solid #e1e3e9;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .big-card:hover{
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.12);
    }

    .big-card-inner{
      position:relative;
      padding: 48px 60px; /* больше внутренние отступы */
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .big-card img{
      max-width: 100%;
      height:auto;
      display:block;
    }

    .big-card-caption{
      position:absolute;
      left: 60px;
      bottom: 18px; /* чуть выше, чтобы “дышало” */
      font-size: 24px;
      letter-spacing: 0.04em;
    }

    .big-card-caption .title{
      font-size: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .big-card-caption span{ text-transform: uppercase; }
    .big-card-caption .accent{ font-weight: 700; }

    .go-link{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color:#444;

      opacity:0;
      transform: translateY(6px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .go-link .divider{
      width: 140px;
      height: 1px;
      background:#bbb;
    }

    .big-card:hover .go-link{
      opacity:1;
      transform: translateY(0);
    }

    /* БЛОК С ССЫЛКАМИ */
    .links{
      margin-top: 70px;
      font-size: 15px;
      line-height: 1.8;
    }

    .links-row{ margin-bottom: 10px; }
    .links-row a{
      font-weight: 600;
      color:#444;
      text-decoration:none;
      border-bottom: 1px solid #999;
    }
    .links-row a:hover{ border-bottom-color: transparent; }

    /* ФУТЕР */
    .footer{
      margin-top:auto;
      padding-top: 26px;
      border-top: 1px solid #d6d9e0;
      font-size: 13px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:#666;
    }

    @media (max-width: 900px){
      .page{ padding: 28px 20px 24px; }
      .cards-row{ gap: 24px; }
      .big-card-inner{ padding: 28px 24px; }
      .big-card-caption{ left: 24px; bottom: 22px; font-size: 20px; }
      .shell{ border-radius: 22px; margin: 16px 0; }
    }

    @media (max-width: 520px){
      .container{ padding: 0 14px; }
      .footer{ flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="shell">
      <div class="page">

        <header class="header">
          <div class="logo">
            <img src="images/logo.svg" alt="SKYRIS">
          </div>
        </header>

        <main>

          <div class="cards-row">

            <!-- Техник 6S -->
            <a class="big-card" href="technic6S/">
              <div class="big-card-inner">
                <img src="images/technic6S.png" alt="Техник 6S">
                <div class="big-card-caption">
                  <div class="title">
                    <span>Техник </span><span class="accent">6S</span>
                  </div>

                  <div class="go-link">
                    <span class="divider"></span>
                    <span class="text">В раздел</span>
                  </div>
                </div>
              </div>
            </a>

            <!-- Пилот FPV -->
            <a class="big-card" href="pilotFPV/">
              <div class="big-card-inner">
                <img src="images/pilotfpv.png" alt="Пилот FPV">
                <div class="big-card-caption">
                  <div class="title">
                    <span>Пилот </span><span class="accent">FPV</span>
                  </div>
                  <div class="go-link">
                    <span class="divider"></span>
                    <span class="text">В раздел</span>
                  </div>
                </div>
              </div>
            </a>

          </div>

          <section class="links">
            <div class="links-row">
              Техническая поддержка&nbsp;
              <a href="https://t.me/SKYRIS_support" target="_blank">@SKYRIS_support</a>
            </div>
            <div class="links-row">
              Новости компании&nbsp;
              <a href="https://t.me/skyris_public" target="_blank">@skyris_public</a>
            </div>
          </section>

        </main>

        <footer class="footer">
          <div>
            <a href="mailto:info@skyris.pro" style="color:#666;">info@skyris.pro</a>
          </div>
          <div>ООО «Скайрис» 2025 © Все права защищены</div>
        </footer>

      </div>
    </div>
  </div>

</body>
</html>
