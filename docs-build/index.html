<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Документация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#f5f6f8;
      color:#333;
    }

    /* ===== ШАПКА ===== */
    .gen-header{
      position: sticky;
      top: 0;
      z-index: 50;
      display:flex;
      align-items:center;
      gap:16px;
      padding: 14px 18px;
      background:#ffffff;
      border-bottom:1px solid #e1e3e9;
    }

    .icon-home{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:inherit;
      min-width: 80px;
    }

    .logo img{
      height:14px;
      width:auto;
      display:block;
    }

    .header-nav-link{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .header-nav-link a{
      text-decoration:none;
      color:#444;
      font-weight:600;
      border-bottom: 1px solid transparent;
    }

    .header-nav-link a:hover{
      border-bottom-color:#999;
    }

    .wy-header-nav-search{
      margin-left:auto;
    }

    /* ===== ОСНОВА ===== */
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .wy-nav-content{
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .rst-content{
      padding: 32px clamp(16px, 4vw, 56px) 32px;
    }

    /* ===== КАРТОЧКИ ===== */
    .cards-row{
      display:flex;
      gap:32px;
      flex-wrap:wrap;
    }

    .big-card{
      flex:1 1 420px;
      min-height:320px;
      background:#f1f2f5;
      border-radius:26px;
      text-decoration:none;
      color:inherit;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      border:1px solid #e1e3e9;
      transition:.2s;
    }

    .big-card:hover{
      transform: translateY(-4px);
      box-shadow:0 14px 28px rgba(0,0,0,0.12);
    }

    .big-card-inner{
      position:relative;
      padding:40px 52px;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .big-card img{
      max-width:100%;
      height:auto;
    }

    .big-card-caption{
      position:absolute;
      left:52px;
      bottom:12px;
      font-size:24px;
      text-transform:uppercase;
    }

    .accent{ font-weight:700; }

    .go-link{
      margin-top:8px;
      font-size:14px;
      opacity:.6;
    }

    /* ===== ФУТЕР (ПОДНЯТ ВЫШЕ) ===== */
    footer{
      margin-top: 48px;   /* ← ВОТ ТУТ РЕГУЛИРУЕШЬ ВЫСОТУ */
      background:#ffffff;
      border-top:1px solid #e1e3e9;
      padding:22px 18px;
    }

    .projectInfo{
      display:flex;
      flex-direction:column;
      gap:10px;
      color:#666;
    }

    .projectInfo a{
      color:#444;
      text-decoration:none;
      width: fit-content;
    }

    .projectInfo a:hover{
      text-decoration:underline;
    }

    .contentInfo{
      margin-top:14px;
      font-size:13px;
      color:#888;
      text-align:right;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width:768px){
      .rst-content{
        padding:20px 16px;
      }
      .big-card-inner{
        padding:28px 24px;
      }
      .big-card-caption{
        left:24px;
        font-size:20px;
      }
    }
  </style>
</head>

<body>

<nav class="gen-header">
  <a href="#" class="icon-home">
    <div class="logo">
      <img src="images/logo.svg" alt="SKYRIS">
    </div>
  </a>

  <div class="header-nav-link">
    <a href="https://skyris.pro/" target="_blank">Сайт SKYRIS</a>
    <a href="https://t.me/skyris_public" target="_blank">Новости компании</a>
  </div>
</nav>

<div class="page">

  <div class="wy-nav-content">
    <div class="rst-content">
      <main>
        <div class="cards-row">

          <a class="big-card" href="technic6S/">
            <div class="big-card-inner">
              <img src="images/technic6S.png" alt="">
              <div class="big-card-caption">
                Техник <span class="accent">6S</span>
                <div class="go-link">В раздел</div>
              </div>
            </div>
          </a>

          <a class="big-card" href="pilotFPV/">
            <div class="big-card-inner">
              <img src="images/pilotfpv.png" alt="">
              <div class="big-card-caption">
                Пилот <span class="accent">FPV</span>
                <div class="go-link">В раздел</div>
              </div>
            </div>
          </a>

        </div>
      </main>
    </div>
  </div>

  <footer>
    <div class="projectInfo">
      <span>Обратиться за помощью в техническую поддержку</span>
      <a href="https://t.me/SKYRIS_support" target="_blank">• telegram @SKYRIS_support</a>
      <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
    </div>

    <div class="contentInfo">
      ООО «Скайрис» 2025 © Все права защищены
    </div>
  </footer>

</div>

</body>
</html>
