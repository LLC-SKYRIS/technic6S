{% extends "website/page.html" %}

{% block page %}
  {{ super() }}

  <footer class="site-footer" id="site-footer">
    <div class="site-footer__inner">
      <div class="projectInfo">
        <span>Обратиться за помощью в техническую поддержку</span>
        <a href="https://t.me/skyris_support" target="_blank" rel="noopener">• telegram @skyris_support</a>
        <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
      </div>

      <div role="contentinfo" class="contentInfo">
        ООО «Скайрис» 2025 © Все права защищены
      </div>
    </div>
  </footer>

  <script>
  (function () {
    function moveFooterAfterArrows() {
      const footer = document.getElementById('site-footer');
      if (!footer) return false;

      // В разных темах стрелки могут быть разными классами
      const next =
        document.querySelector('.navigation-next') ||
        document.querySelector('a.navigation-next') ||
        document.querySelector('.book .book-body a.navigation-next');

      const prev =
        document.querySelector('.navigation-prev') ||
        document.querySelector('a.navigation-prev') ||
        document.querySelector('.book .book-body a.navigation-prev');

      // Идеально: ставим после NEXT (она последняя)
      if (next) {
        next.insertAdjacentElement('afterend', footer);
        return true;
      }

      // Если next нет (например, последняя страница) — ставим после PREV
      if (prev) {
        prev.insertAdjacentElement('afterend', footer);
        return true;
      }

      return false;
    }

    // 1) сразу
    if (moveFooterAfterArrows()) return;

    // 2) ждём, пока стрелки появятся/перерисуются
    const root = document.querySelector('.book') || document.body;
    const obs = new MutationObserver(() => {
      if (moveFooterAfterArrows()) obs.disconnect();
    });
    obs.observe(root, { childList: true, subtree: true });

    // 3) запасная попытка после полной загрузки
    window.addEventListener('load', moveFooterAfterArrows);
  })();
  </script>


{% endblock %}
