{% extends "website/page.html" %}

{% block page %}
  {{ super() }}

  <footer class="site-footer" id="site-footer">
    <div class="site-footer__inner">
      <div class="projectInfo">
        <span>Обратиться за помощью в техническую поддержку</span>
        <a href="https://t.me/skyris_support" target="_blank" rel="noopener">• telegram @skyris_support</a>
        <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
      </div>

      <div role="contentinfo" class="contentInfo">
        ООО «Скайрис» 2025 © Все права защищены
      </div>
    </div>
  </footer>

  <script>
  (function () {
    const footer = document.getElementById('site-footer');
    if (!footer) return;

    // Правая колонка (без сайдбара)
    const bodyInner = document.querySelector('.book .book-body .body-inner');
    if (!bodyInner) return;

    // Блок со стрелками ← →
    const navigation = bodyInner.querySelector('.navigation');
    if (navigation) {
      // ✅ ВАЖНО: вставляем футер ПОСЛЕ стрелок
      navigation.insertAdjacentElement('afterend', footer);
    }
  })();
  </script>


{% endblock %}
