{% extends "website/page.html" %}

{% block page %}
  {{ super() }}

  <footer class="site-footer" id="site-footer">
    <div class="site-footer__inner">
      <div class="projectInfo">
        <span>Обратиться за помощью в техническую поддержку</span>
        <a href="https://t.me/skyris_support" target="_blank" rel="noopener">• telegram @skyris_support</a>
        <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
      </div>

      <div role="contentinfo" class="contentInfo">
        ООО «Скайрис» 2025 © Все права защищены
      </div>
    </div>
  </footer>

  <script>
    (function () {
      // переносим футер под контент страницы (в правую колонку), не под меню
      var footer = document.getElementById('site-footer');
      if (!footer) return;

      // правая колонка (без sidebar)
      var bodyInner = document.querySelector('.book .book-body .body-inner');
      if (!bodyInner) return;

      // .page-wrapper содержит контент + стрелки навигации
      var pageWrapper = bodyInner.querySelector('.page-wrapper');
      if (!pageWrapper) return;

      // ставим футер сразу после page-wrapper => будет под стрелками
      pageWrapper.insertAdjacentElement('afterend', footer);
    })();
  </script>
{% endblock %}
