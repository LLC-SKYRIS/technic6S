{% extends "website/page.html" %}

{% block page %}
  {{ super() }}

  <footer class="site-footer" id="site-footer">
    <div class="site-footer__inner">
      <div class="projectInfo">
        <span>Обратиться за помощью в техническую поддержку</span>
        <a href="https://t.me/skyris_support" target="_blank" rel="noopener">• telegram @skyris_support</a>
        <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
      </div>

      <div role="contentinfo" class="contentInfo">
        ООО «Скайрис» 2025 © Все права защищены
      </div>
    </div>
  </footer>

  <script>
  (function () {
    function moveFooter() {
      const footer = document.getElementById('site-footer');
      if (!footer) return false;

      // Ищем блок стрелок в разных темах (GitBook/HonKit)
      const nav =
        document.querySelector('.book .book-body .navigation') ||
        document.querySelector('.book .book-body .page-wrapper .navigation') ||
        document.querySelector('.book .book-body .body-inner .navigation') ||
        document.querySelector('.book .book-body .page-inner .navigation') ||
        document.querySelector('.navigation');

      if (!nav) return false;

      // Если футер уже стоит после стрелок — ничего не делаем
      if (footer.previousElementSibling === nav) return true;

      nav.insertAdjacentElement('afterend', footer);
      return true;
    }

    // 1) Пытаемся сразу
    if (moveFooter()) return;

    // 2) Если навигация появляется позже — наблюдаем DOM
    const root = document.querySelector('.book') || document.body;
    const obs = new MutationObserver(function () {
      if (moveFooter()) obs.disconnect();
    });

    obs.observe(root, { childList: true, subtree: true });

    // 3) Фоллбек: ещё одна попытка после полной загрузки
    window.addEventListener('load', function () {
      moveFooter();
    });
  })();
  </script>


{% endblock %}
