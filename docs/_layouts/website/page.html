{% extends "website/page.html" %}

{% block page %}
  {{ super() }}

  <footer class="site-footer" id="site-footer">
    <div class="site-footer__inner">
      <div class="projectInfo">
        <span>Обратиться за помощью в техническую поддержку</span>
        <a href="https://t.me/skyris_support" target="_blank" rel="noopener">• telegram @skyris_support</a>
        <a href="mailto:info@skyris.pro">• info@skyris.pro</a>
      </div>

      <div role="contentinfo" class="contentInfo">
        ООО «Скайрис» 2025 © Все права защищены
      </div>
    </div>
  </footer>

  <script>
  (function () {
    function placeFooter() {
      const footer = document.getElementById('site-footer');
      if (!footer) return false;

      const pageWrapper =
        document.querySelector('.book .book-body .body-inner .page-wrapper') ||
        document.querySelector('.book .book-body .page-wrapper') ||
        document.querySelector('.page-wrapper');

      if (!pageWrapper) return false;

      // Вставляем футер в самый конец page-wrapper (после стрелок)
      pageWrapper.appendChild(footer);
      return true;
    }

    if (placeFooter()) return;

    const root = document.querySelector('.book') || document.body;
    const obs = new MutationObserver(() => {
      if (placeFooter()) obs.disconnect();
    });
    obs.observe(root, { childList: true, subtree: true });

    window.addEventListener('load', placeFooter);
  })();
  </script>


{% endblock %}
