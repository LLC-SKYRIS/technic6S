name: Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Patch honkit-plugin-add-js (mkdir before write)
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const p = path.join(process.cwd(), 'node_modules', 'honkit-plugin-add-js', 'index.js');
          let s = fs.readFileSync(p, 'utf8');

          if (!s.includes('fs.mkdirSync(path.dirname')) {
            s = s.replace(
              /fs\.writeFileSync\(([^,]+),/g,
              "fs.mkdirSync(path.dirname($1), { recursive: true });\n    fs.writeFileSync($1,"
            );

            if (!s.includes("const path = require('path')") && !s.includes('var path = require')) {
              s = s.replace(
                /const fs = require\('fs'\);\n/,
                "const fs = require('fs');\nconst path = require('path');\n"
              );
            }

            fs.writeFileSync(p, s, 'utf8');
            console.log('Patched:', p);
          } else {
            console.log('Already patched:', p);
          }
          NODE


      - name: Build Honkit books
        run: |
          mkdir -p docs-build
          npx honkit --version

          npx honkit build docs/technic6S docs-build/technic6S
          npx honkit build docs/pilotFPV  docs-build/pilotFPV


      - name: Create redirect /tdocs/ -> /
        run: |
          set -euo pipefail
          mkdir -p docs-build/tdocs
          printf '%s\n' \
      '<!doctype html>' \
      '<html lang="ru">' \
      '  <head>' \
      '    <meta charset="utf-8" />' \
      '    <meta http-equiv="refresh" content="0; url=/" />' \
      '    <link rel="canonical" href="/" />' \
      '    <script>window.location.replace("/");</script>' \
      '    <title>Redirecting…</title>' \
      '  </head>' \
      '  <body>' \
      '    <p>Redirecting to <a href="/">docs.skyris.ru</a>…</p>' \
      '  </body>' \
      '</html>' \
          > docs-build/tdocs/index.html




      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
